# Deterministic lexical discovery; agent decisions require actual project evidence.
# These are not claims of native model activation or behavior.
version: 1
selection:
  - query: "triage workflow routing light mode"
    expected: task-routing
    intent: routing
  - query: "debug traceback exception reproduce root cause"
    expected: systematic-debugging
    intent: diagnosis
  - query: "verification evidence checks proof completion"
    expected: verification-before-done
    intent: proof
  - query: "authoring registry governance skill metadata"
    expected: skill-authoring
    intent: authoring
  - query: "grill requirements interview acceptance"
    expected: requirements-discovery
    intent: elicitation
  # Domain neighbors that must NOT be swallowed by Core
  - query: "FastAPI Pydantic endpoint"
    expected: fastapi-service
    intent: negative-core
  - query: "AWS Bedrock Converse inference"
    expected: aws-bedrock
    intent: negative-core
  - query: "SQLAlchemy AsyncSession Alembic transaction"
    expected: python-persistence
    intent: negative-core
  - query: "find external skills import provenance audit"
    expected: external-skill-audit
    intent: negative-core
  - query: "ADR architecture decision tradeoff"
    expected: architecture-decision
    intent: negative-core
workflows:
  # Pure text yields an abstention, even when risk looks obvious to a human.
  - query: "correct a typo in documentation"
  - query: "build a backend API"
  - query: "migrate production database permissions"
observed_workflows:
  - name: "local reversible documentation edit"
    signals: {local_reversible: true}
    expected: light
  - name: "cross-module ordinary API change"
    signals: {multi_component: true}
    expected: standard
  - name: "tenant authorization change"
    signals: {authorization_or_secrets: true}
    expected: deep
  - name: "irreversible customer data deletion"
    signals: {destructive_or_irreversible: true}
    expected: deep
no_match:
  - "zzzxxyyqq"
  - ""
# Important: these fixtures test lexical rank only, not semantic correctness.
