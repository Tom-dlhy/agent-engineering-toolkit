# Deterministic candidate properties. Not measurements of native skill loading.
version: 1
selection:
  - query: choisir une base de données pour mon SaaS
    include: [database-selection]
    exclude: [base-ui]
  - query: choose a database for my SaaS
    include: [database-selection]
    exclude: [base-ui]
  - query: comparer les bases de données pour le stockage
    include: [database-selection]
    exclude: [base-ui]
  - query: debug duplicate payment after provider timeout
    include: [systematic-debugging]
    exclude: [cloud-provider-selection, authentication-solution-selection]
  - query: diagnostiquer un paiement dupliqué après un timeout fournisseur
    include: [systematic-debugging]
    exclude: [cloud-provider-selection]
  - query: Implement a Base UI Dialog render
    include: [base-ui]
    exclude: [database-selection]
