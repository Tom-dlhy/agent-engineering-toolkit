    expected: light
  - query: corriger une faute dans la documentation d'authentification
    expected: light
  - query: restrict one tenant lookup
    expected: deep
  - query: remove the ownership filter from lookup
    expected: deep
  - query: modifier le prédicat d'autorisation entre tenants
    expected: deep
  - query: perform an irreversible data migration
    expected: deep
  - query: local reversible refactor of a helper
    expected: light
