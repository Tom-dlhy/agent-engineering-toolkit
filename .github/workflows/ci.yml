name: CI

on:
  pull_request:
    branches: [main, feat/modular-skill-engine]
  push:
    branches: [main, 'refactor/**', 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    name: validate-skills
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: data_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d data_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate catalog, skills and profiles
        run: python scripts/validate_skills.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Plan offline A/B/C benchmark without model execution
        run: python scripts/benchmark_aet.py plan --manifest evals/benchmark/example.json --host codex --model simulated-model --trials 2
      - name: Install pinned ephemeral PostgreSQL test driver
        run: python -m pip install "psycopg[binary]==3.3.6"
      - name: Test actual PostgreSQL constraints, RLS and transactions
        env:
          DATA_TEST_EPHEMERAL: "1"
          PG_DATA_TEST_DSN: postgresql://postgres:local_ephemeral_password@127.0.0.1:5432/data_ci
        run: python -m unittest discover -s examples/data-postgres/tests -v
      - name: Run Python service integration example
        run: |
          python -m pip install -e "./examples/python-service[dev]"
          python -m pytest examples/python-service/tests -q
      - name: Setup Node.js 24 for TypeScript backend example
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 verified SHA
        with:
          node-version: "24"
      - name: Run TypeScript backend runtime contract tests
        run: node --test examples/backend-typescript/tests/*.test.ts
      - name: Run frontend SSR and direct RPC boundary tests
        run: node --test examples/frontend-boundaries/tests/*.test.mjs
      - name: Smoke test progressive references
        run: |
          python scripts/skillctl.py references aws-bedrock
          python scripts/skillctl.py read-ref aws-bedrock references/converse-api.md > /dev/null
          python scripts/context_budget.py --profile aws-platform --activated aws-bedrock --reference aws-bedrock:references/converse-api.md
      - name: Smoke test skill finder
        run: |
          python scripts/skillctl.py profiles
          python scripts/skillctl.py search "AWS S3 IAM permissions" --profile cloud-engineering --json
          python scripts/skillctl.py recommend "production database migration" --profile python-backend
      - name: Enforce metadata budget across all profiles
        run: python scripts/context_budget.py --all --budget 2500
      - name: Check Python syntax
        run: python -m compileall -q toolkit scripts tests

  installer-cross-platform:
    name: installer-v2 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test managed installer and packaged native artifacts
        run: python -m unittest discover -s tests -p test_installer_v2.py -v
      - name: Verify CLI syntax
        run: python -m compileall -q toolkit/managed_installer.py toolkit/plugin_packager.py scripts/manage_install.py scripts/package_plugins.py
