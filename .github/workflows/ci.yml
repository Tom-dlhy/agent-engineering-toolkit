name: CI

on:
  pull_request:
    branches: [main, feat/modular-skill-engine]
  push:
    branches: [main, 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    name: validate-skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate catalog, skills and profiles
        run: python scripts/validate_skills.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test progressive references
        run: |
          python scripts/skillctl.py references aws-bedrock
          python scripts/skillctl.py read-ref aws-bedrock references/converse-api.md > /dev/null
          python scripts/context_budget.py --profile aws-platform --activated aws-bedrock --reference aws-bedrock:references/converse-api.md
      - name: Smoke test skill finder
        run: |
          python scripts/skillctl.py profiles
          python scripts/skillctl.py search "AWS S3 IAM permissions" --profile cloud-engineering --json
          python scripts/skillctl.py recommend "production database migration" --profile python-backend
      - name: Enforce metadata budget across all profiles
        run: python scripts/context_budget.py --all --budget 2500
      - name: Check Python syntax
        run: python -m compileall -q toolkit scripts tests
