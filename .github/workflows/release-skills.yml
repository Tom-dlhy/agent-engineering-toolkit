name: Release skill distributions

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: skill-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify tag comes from main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate installer
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate_skills.py
          python -m unittest discover -s tests -p test_installer_v2.py -v
      - name: Build verified profile packages
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 2
          mkdir -p dist/release
          for profile_file in profiles/*.yaml; do
            profile="$(basename "$profile_file" .yaml)"
            python scripts/package_plugins.py build --profile "$profile"               --name "aet-$profile" --output "dist/release/$profile"               --version "$version" --apply --zip
            python scripts/package_plugins.py verify --output "dist/release/$profile"
          done
          (cd dist/release && sha256sum -- *.zip > SHA256SUMS)
      - name: Publish release (explicit version tag only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             dist/release/*.zip dist/release/SHA256SUMS             --verify-tag --title "Agent Engineering Toolkit $GITHUB_REF_NAME"             --generate-notes
